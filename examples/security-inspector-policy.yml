# Security Inspector policy
#
# Maintained by the security team in a central repository (e.g. acme/security-policies).
# Every repository that runs the inspector is checked against this file.
# Validate changes locally with:  npx security-inspector validate security-inspector-policy.yml
version: 1

settings:
  # Findings at or above this severity block merge until security approves (low|medium|high|critical).
  blockOn: high
  requiredApprovals: 1
  # Approvals and bypasses survive new commits unless a flagged file changes ("any-change" to be stricter).
  staleApprovals: flagged-changes

  # Who counts as a security reviewer. Team membership needs an `org-token` with "Members: read".
  securityTeam:
    teams: [acme/security]
    users: []
  requestReview: true

  # Only inspect pull requests into these branches (branch globs). Pull requests into other
  # branches get a passing "not applicable" status. Remove to inspect every pull request.
  when:
    baseBranches: [main, "release/*"]

  # Never inspected (applies to every rule except the built-in integrity rule).
  ignorePaths:
    - "**/node_modules/**"
    - "**/vendor/**"
    - "**/*.min.js"
    - "**/*.snap"

  # How many changed files are read in full for `fileContent` rules (API calls per run).
  fileContentLimit: 300

  bypass:
    enabled: true
    command: /security-bypass
    # Besides the security team, who may bypass a false positive.
    teams: [acme/engineering-leads]
    users: []
    allowAuthor: false
    minReasonLength: 15

  labels:
    reviewRequired: security-review-required
    approved: security-approved
    bypassed: security-bypassed

  report:
    maxSnippetLines: 20
    showNonBlocking: true

# Repositories that hold sensitive data or are internet-facing get stricter treatment.
priorityRepositories:
  - name: payments
    reason: PCI-DSS cardholder data environment
    repositories: ["acme/payments-*", "acme/billing-api"]
    blockOn: medium
    severityBoost: 1
    requiredApprovals: 2
    allowBypass: false
  - name: identity
    reason: Customer identity provider
    repositories: ["acme/identity-*", "acme/sso-gateway"]
    blockOn: medium

# Each rule describes a security-critical COMPONENT. ANY change to a file that belongs to the
# component is flagged, whether or not the change itself looks risky: a refactor of the login
# code needs the same review as a change to its password check. A file belongs to a component when
#   paths:        its path matches, e.g. anything under auth/
#   fileContent:  the file contains a marker, e.g. it imports passport or defines login()
# With `match: any`, either is enough. (`content:` also exists, to flag specific changed lines
# anywhere in the codebase, but the rules below deliberately watch whole components.)
rules:
  - id: authentication
    name: Authentication
    severity: critical
    description: Login, credential verification, MFA, SSO and token issuance decide who a user is.
    guidance: Review every change, including refactors. Check that credentials are still verified, tokens are validated and expire, and MFA cannot be skipped.
    match: any
    paths:
      - "**/auth/**"
      - "**/authentication/**"
      - "**/*login*"
      - "**/*signin*"
      - "**/*password*"
      - "**/*oauth*"
      - "**/*saml*"
      - "**/*oidc*"
      - "**/*mfa*"
      - "**/*sso*"
    excludePaths: &not-code ["**/*.test.*", "**/*.spec.*", "**/__tests__/**", "**/test/**", "**/tests/**", "**/*.md", "**/*.css", "**/*.scss", "**/*.svg", "**/*.png"]
    fileContent:
      # Authentication libraries: JavaScript/TypeScript, Python, Java, Ruby, Go.
      - pattern: '(from|require\()\s*["''](passport[\w-]*|jsonwebtoken|jose|bcrypt(js)?|argon2|next-auth[\w/-]*|@auth/[\w-]+|express-jwt|otplib|speakeasy|@simplewebauthn/[\w-]+)["'']'
      - pattern: '^\s*(from|import)\s+(django\.contrib\.auth|flask_login|flask_jwt_extended|passlib|jwt|authlib)\b'
      - pattern: '(org\.springframework\.security|\bdevise\b|golang\.org/x/oauth2|github\.com/golang-jwt)'
      # Code that defines authentication functions.
      - pattern: '\b(function|def|func)\s+(\([^)]*\)\s*)?\w*([Aa]uthenticate|[Ll]ogin|[Ss]ign_?[Ii]n|verify_?[Pp]assword|check_?[Pp]assword|hash_?[Pp]assword|issue_?[Tt]oken|verify_?[Tt]oken|refresh_?[Tt]oken)\w*\s*\('

  - id: authorization
    name: Authorization & access control
    severity: critical
    description: Role, permission and ownership checks decide what a user may do.
    guidance: Check that no route, query or action lost its permission or ownership check, and that roles were not widened.
    match: any
    paths: ["**/permissions/**", "**/policies/**", "**/rbac/**", "**/acl/**", "**/admin/**", "**/*admin*", "**/*authoriz*", "**/middleware/*auth*"]
    excludePaths: *not-code
    fileContent:
      - pattern: '(from|require\()\s*["''](@casl/[\w-]+|casbin|accesscontrol|express-jwt-permissions)["'']'
      - pattern: '(@PreAuthorize|@RolesAllowed|@Secured|permission_classes|\bpundit\b|\bcancancan\b|authorize!)'
      # Code that defines OR performs permission checks, e.g. `if (!req.user.isAdmin)`. Removing
      # the last check from a file still counts, because removed lines are searched too.
      - pattern: '\b(is_?[Aa]dmin|[Hh]as_?[Pp]ermission|[Hh]as_?[Rr]ole|[Rr]equire_?[Rr]ole|[Cc]an_?[Aa]ccess|[Aa]uthorize|check_?[Pp]ermissions?)\b'

  - id: session-management
    name: Session & CSRF handling
    severity: high
    description: Session storage, cookie settings and CSRF protection guard against hijacking and forged requests.
    guidance: Confirm cookies stay Secure/HttpOnly/SameSite, sessions still expire and CSRF protection is still applied.
    match: any
    paths: ["**/middleware/*session*", "**/middleware/*csrf*"]
    excludePaths: *not-code
    fileContent:
      - pattern: '(from|require\()\s*["''](express-session|cookie-session|connect-redis|iron-session|csurf|lusca)["'']'
      - pattern: '\b(SESSION_COOKIE_\w+|SESSION_ENGINE|CSRF_\w+|session\.cookie)\b'

  - id: cryptography
    name: Cryptography & TLS
    severity: high
    description: Encryption, signing, key handling and TLS configuration.
    guidance: Watch for weaker algorithms or modes, key or IV handling changes and relaxed certificate validation.
    match: any
    paths: ["**/crypto/**", "**/encryption/**", "**/*cipher*", "**/*tls*"]
    excludePaths: *not-code
    fileContent:
      - pattern: '(createCipheriv|createDecipheriv|createSign|createVerify|generateKeyPair|crypto\.subtle|javax\.crypto|cryptography\.hazmat|from Crypto\.Cipher|crypto/(aes|cipher|rsa|ecdsa|tls)|tls\.Config\{|ssl\.create_default_context|rejectUnauthorized|NODE_TLS_REJECT_UNAUTHORIZED)'

  - id: secrets-management
    name: Secrets management
    severity: high
    description: Code and configuration that load credentials from vaults, KMS or environment files.
    guidance: Make sure secrets still come from the secret store and are not logged, hardcoded or exposed to the client.
    match: any
    paths: ["**/.env*", "**/secrets/**", "**/*vault*", "**/*kms*"]
    fileContent:
      - pattern: '(@aws-sdk/client-(kms|secrets-manager)|@google-cloud/secret-manager|@azure/keyvault-secrets|node-vault|\bhvac\b|SecretManagerServiceClient)'

  - id: security-middleware
    name: Security headers & CORS
    severity: high
    description: Browser-side protections against XSS, clickjacking and cross-origin data theft.
    guidance: Check that CORS does not allow arbitrary origins with credentials and CSP/HSTS are not weakened.
    excludePaths: *not-code
    fileContent:
      - pattern: '(from|require\()\s*["''](helmet|cors|@fastify/(cors|helmet)|flask_cors)["'']'
      - pattern: '(Content-Security-Policy|Strict-Transport-Security|Access-Control-Allow-Origin|X-Frame-Options|CORS_ALLOWED_ORIGINS|corsheaders)'

  - id: payments
    name: Payment processing
    severity: critical
    description: Card data, payouts and payment provider integrations.
    match: any
    paths: ["**/payments/**", "**/billing/**", "**/checkout/**"]
    excludePaths: *not-code
    fileContent:
      - pattern: '(from|require\()\s*["''](stripe|@stripe/[\w-]+|braintree|@adyen/[\w-]+|@paypal/[\w-]+)["'']'

  - id: infrastructure-iam
    name: Infrastructure & IAM
    severity: high
    description: Cloud permissions, network exposure and infrastructure-as-code.
    guidance: Look for widened IAM permissions, public buckets and network rules open to the internet.
    paths: ["**/*.tf", "**/terraform/**", "**/iam/**", "**/k8s/**/*rbac*", "**/helm/**/values*.yaml"]

  - id: ci-pipeline
    name: CI/CD pipeline
    severity: medium
    description: Build pipelines have access to deployment credentials.
    paths: [".github/workflows/**", ".gitlab-ci.yml", "Jenkinsfile", ".circleci/**", "buildkite/**"]

  - id: dependencies
    name: Dependency changes
    severity: medium
    description: New or updated third-party packages (supply chain).
    priorityOnly: true
    # Rules can have their own conditions too: only check dependencies on the way into main.
    when:
      baseBranches: [main]
    paths: ["**/package.json", "**/requirements*.txt", "**/pyproject.toml", "**/go.mod", "**/Gemfile", "**/pom.xml", "**/build.gradle*", "**/Cargo.toml"]
